name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: default
          bundler-cache: false
      - run: gem install hanami -v '~> 2.2.0'
      - run: gem install padrino -v '~> 0.15.0' --no-document
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: sbt/setup-sbt@v1
      - uses: actions/cache@v4
        with:
          path: /tmp/runspace-skeleton-gen
          key: runspace-skeleton-gen-v4-${{ runner.os }}
      - run: npm ci
      - run: npm run prepare:frameworks
      - run: npm run format:check
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
