[package]
name = "runspace"
version = "0.0.1"
description = "Runspace desktop sandbox"
authors = ["enegalan"]
edition = "2021"

[lib]
name = "runspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
